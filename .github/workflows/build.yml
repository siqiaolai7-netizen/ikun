name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> $GITHUB_ENV

      - name: Prepare Clash.Meta
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          rm -rf core/Clash.Meta

          git clone \
            --depth 1 \
            --branch FlClash \
            https://github.com/chen08209/Clash.Meta.git \
            core/Clash.Meta

          echo "=== Clash.Meta go.mod ==="
          grep -n "sing-shadowtls" core/Clash.Meta/go.mod || true

          echo "=== Clash.Meta module ==="
          cd core/Clash.Meta
          go mod download
          go mod verify

      - name: Fix CORE Go dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          echo "=== Before fix ==="
          grep -n "sing-shadowtls" core/go.mod || true
          grep -n "sing-shadowtls" core/go.sum || true

          cd core

          SHADOWTLS_VERSION="$(go list -m -f '{{.Version}}' \
            github.com/metacubex/sing-shadowtls 2>/dev/null || true)"

          if [ -z "$SHADOWTLS_VERSION" ] || [ "$SHADOWTLS_VERSION" = "<nil>" ]; then
            SHADOWTLS_VERSION="v0.0.0-20260517015314-c11c36474edc"
          fi

          echo "Using sing-shadowtls: $SHADOWTLS_VERSION"

          go get "github.com/metacubex/sing-shadowtls@$SHADOWTLS_VERSION"

          go mod download "github.com/metacubex/sing-shadowtls@$SHADOWTLS_VERSION"

          go mod tidy

          go mod download
          go mod verify

          echo "=== After fix ==="
          grep -n "sing-shadowtls" go.mod || true
          grep -n "sing-shadowtls" go.sum || true

      - name: Verify CORE dependency resolution
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          cd core

          echo "=== Go version ==="
          go version

          echo "=== Module ==="
          go env GOMOD

          echo "=== Go work ==="
          go env GOWORK

          echo "=== sing-shadowtls in core/go.sum ==="
          grep "github.com/metacubex/sing-shadowtls" go.sum

          echo "=== Test dependency graph ==="
          GOOS=android \
          GOARCH=arm64 \
          CGO_ENABLED=1 \
          go list -deps -tags=with_gvisor ./... >/tmp/go-deps.txt

          echo "Dependency graph OK"

      - name: Replace package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          find . \
            -type f \
            \( -name "*.dart" -o -name "*.yaml" -o -name "*.yml" -o -name "*.xml" -o -name "*.gradle" -o -name "*.properties" \) \
            -print0 \
            | xargs -0 sed -i 's/package:fl_clash/package:ikun_clash/g'

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          find . \
            -type f \
            \( -name "pubspec.yaml" -o -name "pubspec.lock" \) \
            -print0 \
            | xargs -0 sed -i 's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3
        run: |
          set -eux

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

      - name: Setup libclang
        run: |
          set -eux

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libclang-dev

          echo "=== clang ==="
          clang --version

          echo "=== libclang ==="
          find /usr/lib /usr/lib/llvm \
            -name "libclang.so*" \
            -o -name "libclang-cpp.so*" \
            2>/dev/null | head -50

      - name: Link libclang into NDK
        run: |
          set -eux

          NDK="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "NDK=$NDK"

          find /usr/lib /usr/lib/llvm \
            \( -name "libclang.so*" -o -name "libclang-cpp.so*" \) \
            -print 2>/dev/null | head -50

          mkdir -p "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib"

          for f in \
            /usr/lib/llvm-*/lib/libclang.so* \
            /usr/lib/llvm-*/lib/libclang-cpp.so* \
            /usr/lib/x86_64-linux-gnu/libclang.so* \
            /usr/lib/x86_64-linux-gnu/libclang-cpp.so*; do

            if [ -e "$f" ]; then
              ln -sf "$f" \
                "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib/$(basename "$f")"
            fi
          done

      - name: Force Android NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          find android \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) \
            -print0 \
            | xargs -0 sed -i \
              -e 's/ndkVersion *= *.*/ndkVersion = "27.3.13750724"/g' \
              -e 's/ndk = "[^"]*"/ndk = "27.3.13750724"/g'

      - name: Fix missing IkunBanner
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          grep -RIl "IkunBanner" lib 2>/dev/null | while read -r file; do
            sed -i \
              -e 's/const IkunBanner()/const SizedBox.shrink()/g' \
              -e 's/IkunBanner()/const SizedBox.shrink()/g' \
              "$file"
          done || true

      - name: Environment check
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          echo "=== Flutter ==="
          flutter --version

          echo "=== Dart ==="
          dart --version

          echo "=== Java ==="
          java -version

          echo "=== Go ==="
          go version

          echo "=== NDK ==="
          ls -la "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "=== CORE module ==="
          cd core
          go env GOMOD
          go env GOPATH
          grep "github.com/metacubex/sing-shadowtls" go.sum

      - name: Flutter clean
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          flutter clean
          rm -rf .dart_tool/setup_build_cache

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -eux

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ikun-clash-arm64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finish
        run: |
          echo "======================================"
          echo " IKUN Clash ARM64 BUILD FINISHED"
          echo "======================================"
