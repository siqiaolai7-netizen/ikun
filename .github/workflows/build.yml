name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sed -i 's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g' pubspec.yaml
          grep -n "sdk:" pubspec.yaml || true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          echo "Finding sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name "sdkmanager" | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          if [ ! -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" ]; then
            echo "Required ARM64 clang not found"
            exit 1
          fi

          echo "NDK setup OK"
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

      - name: Setup libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libclang-18-dev

          LLVM_DIR=""

          if [ -d "/usr/lib/llvm-18/lib" ]; then
            LLVM_DIR="/usr/lib/llvm-18/lib"
          elif [ -d "/usr/lib/llvm-18/lib64" ]; then
            LLVM_DIR="/usr/lib/llvm-18/lib64"
          fi

          if [ -z "$LLVM_DIR" ]; then
            LLVM_DIR=$(find /usr/lib -type d -path "*/llvm-*/lib" | head -n 1)
          fi

          echo "LLVM_DIR=$LLVM_DIR"

          if [ -z "$LLVM_DIR" ] || [ ! -d "$LLVM_DIR" ]; then
            echo "LLVM directory not found"
            exit 1
          fi

          LIBCLANG_FILE=$(find "$LLVM_DIR" -maxdepth 2 -type f -name "libclang*.so*" | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "libclang file not found"
            find /usr/lib -name "libclang*.so*" -print || true
            exit 1
          fi

          echo "LIBCLANG_FILE=$LIBCLANG_FILE"

          if [ ! -e "$LLVM_DIR/libclang.so" ]; then
            sudo ln -sf "$LIBCLANG_FILE" "$LLVM_DIR/libclang.so"
          fi

          echo "LIBCLANG_PATH=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LLVM_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          ls -la "$LLVM_DIR"/libclang*.so*

      - name: Check Rust libclang
        run: |
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls -la "$LIBCLANG_PATH"
          find "$LIBCLANG_PATH" -maxdepth 1 -name "libclang*.so*" -print

      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          find . -type f -name "build.gradle" -o -name "build.gradle.kts" -print0 | \
            xargs -0 sed -i -E \
            's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' || true

          grep -R "ndkVersion" android plugins 2>/dev/null || true

      - name: Fix dashboard const error
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          FILE="lib/views/dashboard/dashboard.dart"

          if [ ! -f "$FILE" ]; then
            echo "dashboard.dart not found"
            exit 1
          fi

          echo "Before patch:"
          nl -ba "$FILE" | sed -n '195,225p'

          python3 <<'PY'
          from pathlib import Path
          import re

          file = Path("lib/views/dashboard/dashboard.dart")
          lines = file.read_text().splitlines()

          target = None

          for i, line in enumerate(lines):
              if "child: IkunBanner()," in line:
                  target = i
                  break

          if target is None:
              print("IkunBanner line not found - nothing to patch")
              raise SystemExit(0)

          print(f"Found IkunBanner at line {target + 1}")

          # 找到包住 IkunBanner 的最近 const 构造器并移除 const
          patch_line = None

          for j in range(target - 1, max(-1, target - 50), -1):
              line
              if patch_line is None:
              print("Could not find enclosing const constructor")
              print("\n".join(
                  f"{i+1}: {lines[i]}"
                  for i in range(max(0, target-15), min(len(lines), target+5))
              ))
              raise SystemExit(1)

          old = lines[patch_line]
          lines[patch_line] = re.sub(r"\bconst\s+", "", lines[patch_line], count=1)

          print(f"Patched line {patch_line + 1}:")
          print("OLD:", old)
          print("NEW:", lines[patch_line])

          file.write_text("\n".join(lines) + "\n")
          PY

          echo "After patch:"
          nl -ba "$FILE" | sed -n '195,225p'

      - name: Check build environment
        run: |
          echo "Flutter:"
          flutter --version

          echo "Dart:"
          dart --version

          echo "NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo "ARM64 clang:"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

          echo "libclang:"
          ls -la "$LIBCLANG_PATH"/libclang*.so*

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finish
        run: |
          echo "================================="
          echo "IKUN Clash ARM64 APK BUILD DONE"
          echo "================================="
