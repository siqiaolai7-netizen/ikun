name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"
          echo "===== PROJECT ROOT ====="
          ls -la "$PWD/source"

      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 修复 package 名称 ====="

          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

          echo "===== 检查剩余引用 ====="
          grep -R "package:fl_clash/" . \
            --include="*.dart" || true

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 修复 Dart SDK ====="

          sed -i 's/sdk: ">=3.12.0 <4.0.0"/sdk: ">=3.13.0 <4.0.0"/g' pubspec.yaml
          sed -i "s/sdk: '>=3.12.0 <4.0.0'/sdk: '>=3.13.0 <4.0.0'/g" pubspec.yaml

          grep -A5 "^environment:" pubspec.yaml || true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          echo "===== 查找 sdkmanager ====="

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "===== 接受 Android licenses ====="
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "===== 安装 NDK 27.3.13750724 ====="
          "$SDKMANAGER" "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK 安装失败"
            exit 1
          fi

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "===== 检查 clang ====="
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

          echo "===== 检查 ARM64 API 35 clang ====="

          CLANG35="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          if [ ! -f "$CLANG35" ]; then
            echo "API 35 clang 不存在"
            exit 1
          fi

          echo "API 35 clang 存在"
          "$CLANG35" --version

      - name: Setup libclang
        run: |
          echo "===== 安装 libclang ====="

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            libclang-dev \
            libclang-18-dev

          echo "===== 查找 libclang ====="

          LIBCLANG_FILE=$(find /usr/lib \
            -type f \
            -name "libclang*.so*" \
            | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "找不到 libclang"
            find /usr/lib -iname "*clang*" -print | head -100
            exit 1
          fi

          echo "找到:"
          echo "$LIBCLANG_FILE"

          LIBCLANG_DIR=$(dirname "$LIBCLANG_FILE")

          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LIBCLANG_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          echo "===== LIBCLANG_PATH ====="
          echo "$LIBCLANG_DIR"

          echo "===== 检查 libclang ====="
          ls -la "$LIBCLANG_DIR"

      - name: Check Rust libclang
        run: |
          echo "===== LIBCLANG_PATH ====="
          echo "$LIBCLANG_PATH"

          if [ ! -d "$LIBCLANG_PATH" ]; then
            echo "LIBCLANG_PATH 不存在"
            exit 1
          fi

          find "$LIBCLANG_PATH" \
            -maxdepth 1 \
            -name "libclang*.so*" \
            -print

      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 固定 NDK 27.3 ====="

          if [ -f android/app/build.gradle ]; then
            sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "27.3.13750724"/g' android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.3.13750724"/g' android/app/build.gradle.kts
          fi

          echo "===== 当前 NDK 配置 ====="

          grep -R "ndkVersion" android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Check build environment
        run: |
          echo "======================================"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "======================================"

          echo "===== clang ====="

          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

          echo "===== ARM64 clang ====="

          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

          echo "===== libclang ====="

          find "$LIBCLANG_PATH" \
            -maxdepth 1 \
            -name "libclang*.so*" \
            -print

      - name: Check Flutter version
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

      - name: Show dashboard context
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== dashboard.dart 195-225 ====="

          if [ -f lib/views/dashboard/dashboard.dart ]; then
            nl -ba lib/views/dashboard/dashboard.dart \
              | sed -n '195,225p'
          else
            echo "找不到 dashboard.dart"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== Flutter clean ====="
          flutter clean

          echo "===== Flutter pub get ====="
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "======================================"
          echo "开始构建 IKUN Clash ARM64 APK"
          echo "======================================"

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Finish
        run: |
          echo "======================================"
          echo "IKUN Clash ARM64 APK 构建完成！"
          echo "======================================"
          
