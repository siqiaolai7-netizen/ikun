name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Extract source
      # =========================================================
      - name: Extract source
        run: |
          set -e

          rm -rf source

          unzip -q IKUN-Clash-final-source.zip -d source

          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

          echo "Source extracted successfully."

      # =========================================================
      # 3. Restore Clash.Meta
      # =========================================================
      - name: Restore Clash.Meta
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "======================================"
          echo "Restoring Clash.Meta"
          echo "======================================"

          mkdir -p core

          rm -rf core/Clash.Meta

          git clone \
            --depth 1 \
            --branch FlClash \
            https://github.com/chen08209/Clash.Meta.git \
            core/Clash.Meta

          echo ""
          echo "Checking Clash.Meta..."

          test -f core/Clash.Meta/go.mod
          test -f core/Clash.Meta/go.sum

          echo ""
          echo "Clash.Meta commit:"

          cd core/Clash.Meta

          git rev-parse HEAD

          echo ""
          echo "Clash.Meta restored successfully."

      # =========================================================
      # 4. Fix Clash.Meta Go dependencies
      # =========================================================
      - name: Fix Clash.Meta Go dependencies
        working-directory: ${{ env.PROJECT_ROOT }}/core/Clash.Meta
        run: |
          set -e

          echo "======================================"
          echo "Fixing Clash.Meta Go dependencies"
          echo "======================================"

          echo ""
          echo "Go version:"
          go version

          echo ""
          echo "Original sing-shadowtls entry:"
          grep \
            "github.com/metacubex/sing-shadowtls" \
            go.mod || true

          echo ""
          echo "Adding correct sing-shadowtls version..."

          go get \
            github.com/metacubex/sing-shadowtls@v0.0.0-20260517015314-c11c36474edc

          echo ""
          echo "Running go mod tidy..."

          go mod tidy

          echo ""
          echo "Downloading all Go modules..."

          go mod download

          echo ""
          echo "Verifying Go modules..."

          go mod verify

          echo ""
          echo "Checking sing-shadowtls in go.mod..."

          grep \
            "github.com/metacubex/sing-shadowtls" \
            go.mod

          echo ""
          echo "Checking sing-shadowtls in go.sum..."

          grep \
            "github.com/metacubex/sing-shadowtls" \
            go.sum

          echo ""
          echo "Go dependency preparation completed."

      # =========================================================
      # 5. Fix source package name
      # =========================================================
      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "Replacing package:fl_clash with package:ikun_clash..."

          if [ -d lib ]; then
            find lib \
              -type f \
              -name "*.dart" \
              -print0 | \
              xargs -0 sed -i \
              's/package:fl_clash\//package:ikun_clash\//g'
          fi

          if [ -d plugins ]; then
            find plugins \
              -type f \
              -name "*.dart" \
              -print0 | \
              xargs -0 sed -i \
              's/package:fl_clash\//package:ikun_clash\//g'
          fi

          echo "Package replacement completed."

      # =========================================================
      # 6. Fix Dart SDK constraint
      # =========================================================
      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          sed -i \
            's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g' \
            pubspec.yaml

          echo "SDK constraint:"
          grep -n "sdk:" pubspec.yaml || true

      # =========================================================
      # 7. Install Java 17
      # =========================================================
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 8. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # =========================================================
      # 9. Setup Android NDK
      # =========================================================
      - name: Setup Android NDK
        run: |
          set -e

          echo "Finding sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "Accepting Android licenses..."

          yes | bash "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Installing NDK 27.3.13750724..."

          bash "$SDKMANAGER" \
            "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "NDK:"
          echo "$NDK_PATH"

          echo ""
          echo "Checking ARM64 compiler..."

          test -f \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" \
            --version

          echo "NDK setup completed."

      # =========================================================
      # 10. Install system libclang
      # =========================================================
      - name: Setup libclang
        run: |
          set -e

          echo "======================================"
          echo "Installing libclang"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            libclang-dev \
            libclang-18-dev

          echo ""
          echo "Searching system libclang..."

          LIBCLANG_FILE=$(find /usr/lib/llvm-18/lib \
            \( -type f -o -type l \) \
            -name "libclang.so*" \
            | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            LIBCLANG_FILE=$(find /usr/lib \
              \( -type f -o -type l \) \
              -name "libclang.so*" \
              | head -n 1)
          fi

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "ERROR: system libclang not found."

            find /usr/lib \
              -name "libclang*.so*" \
              -print || true

            exit 1
          fi

          echo "System libclang:"
          echo "$LIBCLANG_FILE"

          LLVM_DIR=$(dirname "$LIBCLANG_FILE")

          echo "LLVM_DIR=$LLVM_DIR"

          echo "LIBCLANG_PATH=$LLVM_DIR" >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$LLVM_DIR:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

          if [ ! -e "$LLVM_DIR/libclang.so" ]; then
            sudo ln -sf \
              "$LIBCLANG_FILE" \
              "$LLVM_DIR/libclang.so"
          fi

          echo ""
          echo "System libclang installed."

      # =========================================================
      # 11. Put libclang inside Android NDK
      # =========================================================
      - name: Install libclang into NDK
        run: |
          set -e

          echo "======================================"
          echo "Installing libclang into NDK"
          echo "======================================"

          NDK_LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"

          echo "NDK LLVM:"
          echo "$NDK_LLVM"

          test -d "$NDK_LLVM"

          sudo mkdir -p "$NDK_LLVM/lib"
          sudo mkdir -p "$NDK_LLVM/lib64"

          echo ""
          echo "Locating system libclang..."

          SYSTEM_LIBCLANG=$(find /usr/lib/llvm-18/lib \
            \( -type f -o -type l \) \
            -name "libclang.so*" \
            | head -n 1)

          if [ -z "$SYSTEM_LIBCLANG" ]; then
            SYSTEM_LIBCLANG=$(find /usr/lib \
              \( -type f -o -type l \) \
              -name "libclang.so*" \
              | head -n 1)
          fi

          if [ -z "$SYSTEM_LIBCLANG" ]; then
            echo "ERROR: Could not find system libclang."
            exit 1
          fi

          echo "Using:"
          echo "$SYSTEM_LIBCLANG"

          echo ""
          echo "Creating libclang.so links..."

          sudo ln -sf \
            "$SYSTEM_LIBCLANG" \
            "$NDK_LLVM/lib/libclang.so"

          sudo ln -sf \
            "$SYSTEM_LIBCLANG" \
            "$NDK_LLVM/lib64/libclang.so"

          echo ""
          echo "Checking NDK lib..."

          ls -la "$NDK_LLVM/lib"/libclang*

          echo ""
          echo "Checking NDK lib64..."

          ls -la "$NDK_LLVM/lib64"/libclang*

          test -e "$NDK_LLVM/lib/libclang.so"
          test -e "$NDK_LLVM/lib64/libclang.so"

          echo ""
          echo "NDK libclang setup completed."

      # =========================================================
      # 12. Check Rust libclang
      # =========================================================
      - name: Check Rust libclang
        run: |
          set -e

          NDK_LLVM="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64"

          test -e "$NDK_LLVM/lib/libclang.so"
          test -e "$NDK_LLVM/lib64/libclang.so"

          echo ""
          echo "Rust libclang check passed."

      # =========================================================
      # 13. Force NDK version
      # =========================================================
      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          if [ -d android ]; then

            find android \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print0 | \
              xargs -0 sed -i \
              -E 's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              || true

          fi

          echo "NDK version:"
          echo "27.3.13750724"

      # =========================================================
      # 14. Fix missing IkunBanner
      # =========================================================
      - name: Fix missing IkunBanner
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          FILE="lib/views/dashboard/dashboard.dart"

          if [ ! -f "$FILE" ]; then
            echo "dashboard.dart not found."
            exit 1
          fi

          echo "Replacing missing IkunBanner..."

          python3 <<'PY'
          from pathlib import Path

          file = Path("lib/views/dashboard/dashboard.dart")

          text = file.read_text()

          old = "child: IkunBanner(),"
          new = "child: const SizedBox.shrink(),"

          count = text.count(old)

          print(f"Found {count} IkunBanner reference(s).")

          if count:
              text = text.replace(old, new)
              file.write_text(text)
              print("IkunBanner replaced.")
          else:
              print("IkunBanner reference not found.")
          PY

          echo ""
          echo "Checking replacement..."

          grep -n "SizedBox.shrink" "$FILE" || true

      # =========================================================
      # 15. Check build environment
      # =========================================================
      - name: Check build environment
        run: |
          set -e

          echo "======================================"
          echo "Flutter"
          echo "======================================"

          flutter --version

          echo ""
          echo "======================================"
          echo "Dart"
          echo "======================================"

          dart --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "Go"
          echo "======================================"

          go version

          echo ""
          echo "======================================"
          echo "NDK"
          echo "======================================"

          echo "$ANDROID_NDK"

          echo ""
          echo "======================================"
          echo "Clash.Meta"
          echo "======================================"

          CLASH_DIR="${GITHUB_WORKSPACE}/source/core/Clash.Meta"

          test -f "$CLASH_DIR/go.mod"
          test -f "$CLASH_DIR/go.sum"

          echo "go.mod exists."
          echo "go.sum exists."

          echo ""
          echo "sing-shadowtls in go.mod:"

          grep -n \
            "github.com/metacubex/sing-shadowtls" \
            "$CLASH_DIR/go.mod"

          echo ""
          echo "sing-shadowtls in go.sum:"

          grep -n \
            "github.com/metacubex/sing-shadowtls" \
            "$CLASH_DIR/go.sum"

          echo ""
          echo "Go dependency verification:"

          cd "$CLASH_DIR"

          go mod verify

          echo ""
          echo "Clash.Meta dependency check passed."

      # =========================================================
      # 16. Install Flutter dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          flutter clean

          flutter pub get

      # =========================================================
      # 17. Build ARM64 APK
      # =========================================================
      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "======================================"
          echo "Building IKUN Clash ARM64 APK"
          echo "======================================"

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      # =========================================================
      # 18. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # =========================================================
      # 19. Finish
      # =========================================================
      - name: Finish
        run: |
          echo "======================================"
          echo "IKUN Clash ARM64 APK BUILD DONE"
          echo "======================================"

          echo ""
          echo "APK:"
          echo "${GITHUB_WORKSPACE}/source/build/app/outputs/flutter-apk/app-release.apk"
