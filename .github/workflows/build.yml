name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sed -i 's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g' pubspec.yaml

          echo "Dart SDK:"
          grep -n "sdk:" pubspec.yaml || true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name "sdkmanager" | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          if [ ! -x "$CLANG" ]; then
            echo "ARM64 clang not found:"
            echo "$CLANG"
            exit 1
          fi

          "$CLANG" --version

      - name: Setup libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libclang-18-dev

          LLVM_DIR="/usr/lib/llvm-18/lib"

          if [ ! -d "$LLVM_DIR" ]; then
            LLVM_DIR=$(find /usr/lib -type d -path "*/llvm-*/lib" | head -n 1)
          fi

          if [ -z "$LLVM_DIR" ] || [ ! -d "$LLVM_DIR" ]; then
            echo "LLVM directory not found"
            exit 1
          fi

          LIBCLANG_FILE=$(find "$LLVM_DIR" -maxdepth 2 -type f -name "libclang*.so*" | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "libclang not found"
            find /usr/lib -name "libclang*.so*" -print || true
            exit 1
          fi

          if [ ! -e "$LLVM_DIR/libclang.so" ]; then
            sudo ln -sf "$LIBCLANG_FILE" "$LLVM_DIR/libclang.so"
          fi

          echo "LIBCLANG_PATH=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LLVM_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          echo "libclang OK:"
          ls -la "$LLVM_DIR"/libclang*.so*

      - name: Check Rust libclang
        run: |
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls -la "$LIBCLANG_PATH"/libclang*.so*

      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E \
              's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E \
              's/ndkVersion[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              android/app/build.gradle.kts
          fi

          grep -R "ndkVersion" android 2>/dev/null || true

      - name: Fix IkunBanner
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          FILE="lib/views/dashboard/dashboard.dart"

          if [ ! -f "$FILE" ]; then
            echo "dashboard.dart not found"
            exit 1
          fi

          echo "Searching IkunBanner..."

          grep -R "class IkunBanner" lib plugins 2>/dev/null || true
          grep -R "IkunBanner" lib/views/dashboard 2>/dev/null || true

          python3 <<'PY'
          from pathlib import Path

          file = Path("lib/views/dashboard/dashboard.dart")
          text = file.read_text()

          # 如果已经存在定义，就不重复添加
          if "class IkunBanner" in text:
              print("IkunBanner class already exists.")
              raise SystemExit(0)

          # 确保 dashboard 中使用的是普通 GridItem
          text = text.replace("const GridItem(", "GridItem(")

          banner = r'''

          class IkunBanner extends StatelessWidget {
            const IkunBanner({super.key});

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.symmetric(
                  horizontal: 16,
                  vertical: 14,
                ),
                child: const Text(
                  'IKUN Clash',
                  textAlign: TextAlign.center,
                ),
              );
            }
          }
          '''

          text = text.rstrip() + banner + "\n"
          file.write_text(text)

          print("IkunBanner fallback widget added.")
          PY

          echo "Checking IkunBanner:"
          grep -n "class IkunBanner" "$FILE"

      - name: Check build environment
        run: |
          flutter --version
          dart --version

          echo "NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo "ARM64 clang:"
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

          echo "libclang:"
          ls -la "$LIBCLANG_PATH"/libclang*.so*

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finish
        run: |
          echo "================================="
          echo "IKUN Clash ARM64 APK BUILD DONE"
          echo "================================="
