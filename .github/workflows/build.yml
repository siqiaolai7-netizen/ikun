name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 解压 Flutter 源码
      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> $GITHUB_ENV

      # 3. 修复 pubspec 兼容性
      - name: Fix pubspec compatibility
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 原始 pubspec SDK / freezed ====="
          grep -nE "sdk:|freezed:" pubspec.yaml || true

          # 将 Dart SDK 下限调整到当前 Flutter 3.44.0 支持的范围
          sed -i 's/sdk: ">=3.12.0 <4.0.0"/sdk: ">=3.10.0 <4.0.0"/g' pubspec.yaml
          sed -i "s/sdk: '>=3.12.0 <4.0.0'/sdk: '>=3.10.0 <4.0.0'/g" pubspec.yaml

          # freezed 4.x 要求 Dart >=3.13
          # 当前 Dart 3.12，因此降级到 freezed 3.2.5
          sed -i -E 's/^([[:space:]]*freezed:[[:space:]]*)\^4\.[0-9]+\.[0-9]+/\1^3.2.5/g' pubspec.yaml

          echo "===== 修改后的 pubspec SDK / freezed ====="
          grep -nE "sdk:|freezed:" pubspec.yaml || true

      # 4. 安装 Java 17
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. 安装 Flutter 3.44.0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      # 6. 检查 Flutter / Dart 版本
      - name: Check Flutter version
        run: |
          flutter --version
          dart --version

      # 7. 安装依赖
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      # 8. 构建 ARM64 APK
      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # 9. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk

      # 10. 完成
      - name: Finish
        run: |
          echo "======================================"
          echo "IKUN Clash ARM64 APK 构建完成！"
          echo "======================================"
