name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

          echo "Package references fixed."

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sed -i 's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g' pubspec.yaml

          echo "Dart SDK:"
          grep -n "sdk:" pubspec.yaml || true

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -type f -name "sdkmanager" | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          CLANG="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          if [ ! -x "$CLANG" ]; then
            echo "ARM64 clang not found"
            exit 1
          fi

          echo "ARM64 clang:"
          "$CLANG" --version

          echo "NDK setup OK."

      - name: Setup libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libclang-18-dev

          NDK_LLVM="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          echo "NDK LLVM directory:"
          echo "$NDK_LLVM"

          echo "Searching system libclang..."

          LIBCLANG_FILE=$(find /usr/lib -type f -name "libclang.so*" | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "System libclang not found."
            find /usr/lib -name "libclang*.so*" -print || true
            exit 1
          fi

          echo "Found:"
          echo "$LIBCLANG_FILE"

          # rust_api 的 hook 会直接检查 NDK 的 lib/lib64
          mkdir -p "$NDK_LLVM/lib"

          sudo ln -sf "$LIBCLANG_FILE" "$NDK_LLVM/lib/libclang.so"

          # 同时放到 lib64，兼容 hook 的另一种搜索路径
          mkdir -p "$NDK_LLVM/lib64"

          sudo ln -sf "$LIBCLANG_FILE" "$NDK_LLVM/lib64/libclang.so"

          # 设置运行时搜索路径
          echo "LIBCLANG_PATH=$NDK_LLVM/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$NDK_LLVM/lib:$NDK_LLVM/lib64:/usr/lib/llvm-18/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          echo "========== NDK lib =========="
          ls -la "$NDK_LLVM/lib"

          echo "========== NDK lib64 =========="
          ls -la "$NDK_LLVM/lib64"

          echo "libclang fixed inside NDK."

      - name: Check Rust libclang
        run: |
          NDK_LLVM="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"

          echo "Checking:"
          echo "$NDK_LLVM"

          if [ ! -e "$NDK_LLVM/lib/libclang.so" ]; then
            echo "NDK lib/libclang.so NOT FOUND"
            exit 1
          fi

          if [ ! -e "$NDK_LLVM/lib64/libclang.so" ]; then
            echo "NDK lib64/libclang.so NOT FOUND"
            exit 1
          fi

          echo "libclang in NDK:"
          ls -la "$NDK_LLVM/lib/libclang.so"
          ls -la "$NDK_LLVM/lib64/libclang.so"

          echo "Rust libclang check OK."

      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i -E \
              's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E \
              's/ndkVersion[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              android/app/build.gradle.kts
          fi

          echo "NDK configuration:"
          grep -R "ndkVersion" android 2>/dev/null || true

      - name: Fix dashboard const error
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          FILE="lib/views/dashboard/dashboard.dart"

          if [ ! -f "$FILE" ]; then
            echo "dashboard.dart not found"
            exit 1
          fi

          echo "Before patch:"
          nl -ba "$FILE" | sed -n '205,218p'

          sed -i 's/const GridItem(/GridItem(/g' "$FILE"

          echo "After patch:"
          nl -ba "$FILE" | sed -n '205,218p'

          echo "Dashboard const fix OK."

      - name: Fix IkunBanner
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          FILE="lib/views/dashboard/dashboard.dart"

          if grep -q "class IkunBanner" "$FILE"; then
            echo "IkunBanner already exists."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          file = Path("lib/views/dashboard/dashboard.dart")
          text = file.read_text()

          if "class IkunBanner" in text:
              print("IkunBanner already exists.")
              raise SystemExit(0)

          banner = r'''

          class IkunBanner extends StatelessWidget {
            const IkunBanner({super.key});

            @override
            Widget build(BuildContext context) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.symmetric(
                  horizontal: 16,
                  vertical: 14,
                ),
                child: const Text(
                  'IKUN Clash',
                  textAlign: TextAlign.center,
                ),
              );
            }
          }
          '''

          text = text.rstrip() + banner + "\n"
          file.write_text(text)

          print("IkunBanner fallback widget added.")
          PY

          echo "Checking IkunBanner:"
          grep -n "class IkunBanner" "$FILE"

      - name: Check build environment
        run: |
          echo "========== Flutter =========="
          flutter --version

          echo "========== Dart =========="
          dart --version

          echo "========== NDK =========="
          echo "$ANDROID_NDK_ROOT"

          echo "========== ARM64 clang =========="
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" --version

          echo "========== NDK libclang =========="
          ls -la "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/libclang.so"
          ls -la "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib64/libclang.so"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Finish
        run: |
          echo "================================="
          echo "IKUN Clash ARM64 APK BUILD DONE"
          echo "================================="
