name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. 解压源码
      # ==========================================
      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

          echo "===== PROJECT ROOT ====="
          ls -la "$PWD/source"

      # ==========================================
      # 3. 修复 package 名称
      # ==========================================
      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 修复 package:fl_clash ====="

          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i \
            's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i \
              's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

          echo "===== 检查剩余引用 ====="

          grep -R "package:fl_clash/" . \
            --include="*.dart" \
            || true

      # ==========================================
      # 4. 修复 Dart SDK
      # ==========================================
      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 修复 Dart SDK constraint ====="

          sed -i \
            's/sdk: ">=3.12.0 <4.0.0"/sdk: ">=3.13.0 <4.0.0"/g' \
            pubspec.yaml

          sed -i \
            "s/sdk: '>=3.12.0 <4.0.0'/sdk: '>=3.13.0 <4.0.0'/g" \
            pubspec.yaml

          echo "===== 当前 environment ====="

          grep -A5 "^environment:" pubspec.yaml || true

      # ==========================================
      # 5. Java 17
      # ==========================================
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 6. Flutter 3.47.2
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # ==========================================
      # 7. Android NDK 27.3
      # ==========================================
      - name: Setup Android NDK
        run: |
          echo "===== 查找 sdkmanager ====="

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "===== 接受 Android licenses ====="

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "===== 安装 NDK 27.3.13750724 ====="

          "$SDKMANAGER" "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK 安装失败"
            exit 1
          fi
