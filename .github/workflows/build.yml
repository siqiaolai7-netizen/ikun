name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> $GITHUB_ENV

      - name: Fix pubspec SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sed -i "s#sdk: '>=3.10.0 <4.0.0'#sdk: '>=3.10.0-0 <4.0.0'#" pubspec.yaml
          cat pubspec.yaml

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64-APK
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Finish
        run: |
          echo "====================================="
          echo "ARM64 APK BUILD FINISHED"
          echo "====================================="
