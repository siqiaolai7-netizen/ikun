name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Extract source
      # =========================================================
      - name: Extract source
        run: |
          set -e

          rm -rf source

          unzip -q IKUN-Clash-final-source.zip -d source

          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

          echo "Source extracted successfully."
          ls -la source

      # =========================================================
      # 3. Restore Clash.Meta
      # =========================================================
      - name: Restore Clash.Meta
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "======================================"
          echo "Checking Clash.Meta"
          echo "======================================"

          mkdir -p core

          if [ -f "core/Clash.Meta/go.mod" ]; then
            echo "Clash.Meta already exists."
          else
            echo "Clash.Meta is missing."
            echo "Downloading Clash.Meta..."

            rm -rf core/Clash.Meta

            git clone \
              --depth 1 \
              --branch FlClash \
              https://github.com/chen08209/Clash.Meta.git \
              core/Clash.Meta
          fi

          echo ""
          echo "Clash.Meta directory:"
          ls -la core/Clash.Meta

          echo ""
          echo "Checking go.mod..."

          test -f core/Clash.Meta/go.mod

          echo ""
          echo "Clash.Meta restored successfully."

      # =========================================================
      # 4. Fix source package name
      # =========================================================
      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "Replacing package:fl_clash with package:ikun_clash..."

          if [ -d lib ]; then
            find lib \
              -type f \
              -name "*.dart" \
              -print0 | \
              xargs -0 sed -i \
              's/package:fl_clash\//package:ikun_clash\//g'
          fi

          if [ -d plugins ]; then
            find plugins \
              -type f \
              -name "*.dart" \
              -print0 | \
              xargs -0 sed -i \
              's/package:fl_clash\//package:ikun_clash\//g'
          fi

          echo "Package replacement completed."

      # =========================================================
      # 5. Fix Dart SDK constraint
      # =========================================================
      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "Current SDK constraint:"
          grep -n "sdk:" pubspec.yaml || true

          sed -i \
            's/>=3\.12\.0 <4\.0\.0/>=3.13.0 <4.0.0/g' \
            pubspec.yaml

          echo ""
          echo "New SDK constraint:"
          grep -n "sdk:" pubspec.yaml || true

      # =========================================================
      # 6. Install Java 17
      # =========================================================
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 7. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # =========================================================
      # 8. Setup Android NDK
      # =========================================================
      - name: Setup Android NDK
        run: |
          set -e

          echo "======================================"
          echo "Finding sdkmanager"
          echo "======================================"

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo ""
          echo "======================================"
          echo "Accept Android licenses"
          echo "======================================"

          yes | bash "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "======================================"
          echo "Install NDK 27.3.13750724"
          echo "======================================"

          bash "$SDKMANAGER" \
            "ndk;27.3.13750724"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "NDK path:"
          echo "$NDK_PATH"

          echo ""
          echo "======================================"
          echo "Checking ARM64 compiler"
          echo "======================================"

          test -f \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" \
            --version

          echo ""
          echo "NDK setup completed successfully."

      # =========================================================
      # 9. Setup libclang
      # =========================================================
      - name: Setup libclang
        run: |
          set -e

          echo "======================================"
          echo "Installing clang and libclang"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            clang \
            libclang-dev \
            libclang-18-dev

          echo ""
          echo "Searching libclang..."

          LLVM_DIR=""

          if [ -d "/usr/lib/llvm-18/lib" ]; then
            LLVM_DIR="/usr/lib/llvm-18/lib"
          elif [ -d "/usr/lib/llvm-18/lib64" ]; then
            LLVM_DIR="/usr/lib/llvm-18/lib64"
          fi

          if [ -z "$LLVM_DIR" ]; then
            LLVM_DIR=$(find /usr/lib \
              -type d \
              -path "*/llvm-*/lib" \
              | head -n 1)
          fi

          if [ -z "$LLVM_DIR" ]; then
            echo "ERROR: LLVM directory not found."
            exit 1
          fi

          echo "LLVM_DIR=$LLVM_DIR"

          LIBCLANG_FILE=$(find "$LLVM_DIR" \
            -maxdepth 2 \
            -type f \
            -name "libclang*.so*" \
            | head -n 1)

          if [ -z "$LIBCLANG_FILE" ]; then
            echo "ERROR: libclang not found."

            find /usr/lib \
              -name "libclang*.so*" \
              -print || true

            exit 1
          fi

          LIBCLANG_PATH="$LLVM_DIR"

          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$LIBCLANG_PATH:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"

          if [ ! -e "$LIBCLANG_PATH/libclang.so" ]; then
            sudo ln -sf \
              "$LIBCLANG_FILE" \
              "$LIBCLANG_PATH/libclang.so"
          fi

          echo ""
          echo "libclang files:"
          ls -la "$LIBCLANG_PATH"/libclang*

          echo ""
          echo "libclang setup completed."

      # =========================================================
      # 10. Check Rust libclang
      # =========================================================
      - name: Check Rust libclang
        run: |
          set -e

          echo "LIBCLANG_PATH=$LIBCLANG_PATH"

          test -f "$LIBCLANG_PATH/libclang.so"

          ls -la "$LIBCLANG_PATH"/libclang*

          echo ""
          echo "Rust libclang check passed."

      # =========================================================
      # 11. Force NDK version
      # =========================================================
      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "Searching Gradle files..."

          find android \
            -type f \
            \( \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print || true

          if [ -d android ]; then

            find android \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print0 | \
              xargs -0 sed -i \
              -E 's/ndkVersion[[:space:]]*[=:][[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "27.3.13750724"/g' \
              || true

          fi

          echo ""
          echo "NDK version replacement completed."

      # =========================================================
      # 12. Fix missing IkunBanner
      # =========================================================
      - name: Fix missing IkunBanner
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          FILE="lib/views/dashboard/dashboard.dart"

          if [ ! -f "$FILE" ]; then
            echo "dashboard.dart not found."
            exit 1
          fi

          echo "Searching for IkunBanner..."

          grep -n "IkunBanner" "$FILE" || true

          echo ""
          echo "Replacing missing IkunBanner with SizedBox.shrink..."

          python3 <<'PY'
          from pathlib import Path

          file = Path("lib/views/dashboard/dashboard.dart")

          text = file.read_text()

          old = "child: IkunBanner(),"
          new = "child: const SizedBox.shrink(),"

          count = text.count(old)

          print(f"Found {count} IkunBanner reference(s).")

          if count == 0:
              print("IkunBanner reference not found.")
          else:
              text = text.replace(old, new)
              file.write_text(text)
              print("IkunBanner replacement completed.")
          PY

          echo ""
          echo "Checking result..."

          grep -n "IkunBanner" "$FILE" || true
          grep -n "SizedBox.shrink" "$FILE" || true

      # =========================================================
      # 13. Check build environment
      # =========================================================
      - name: Check build environment
        run: |
          set -e

          echo "======================================"
          echo "Flutter"
          echo "======================================"

          flutter --version

          echo ""
          echo "======================================"
          echo "Dart"
          echo "======================================"

          dart --version

          echo ""
          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "NDK"
          echo "======================================"

          echo "$ANDROID_NDK"

          echo ""
          echo "======================================"
          echo "ARM64 clang"
          echo "======================================"

          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" \
            --version

          echo ""
          echo "======================================"
          echo "libclang"
          echo "======================================"

          ls -la "$LIBCLANG_PATH"/libclang*

          echo ""
          echo "======================================"
          echo "Clash.Meta"
          echo "======================================"

          test -f \
            "${GITHUB_WORKSPACE}/source/core/Clash.Meta/go.mod"

          echo "Clash.Meta go.mod exists."

      # =========================================================
      # 14. Install dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          flutter clean

          flutter pub get

      # =========================================================
      # 15. Build ARM64 APK
      # =========================================================
      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      # =========================================================
      # 16. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # =========================================================
      # 17. Finish
      # =========================================================
      - name: Finish
        run: |
          echo "======================================"
          echo "IKUN Clash ARM64 APK BUILD DONE"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "${GITHUB_WORKSPACE}/source/build/app/outputs/flutter-apk/app-release.apk"
