name: IKUN Clash ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q IKUN-Clash-final-source.zip -d source
          echo "PROJECT_ROOT=$PWD/source" >> "$GITHUB_ENV"

      - name: Fix source package name
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 修复 package 名称 ====="

          find lib -type f -name "*.dart" -print0 | \
            xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true

          if [ -d plugins ]; then
            find plugins -type f -name "*.dart" -print0 | \
              xargs -0 sed -i 's/package:fl_clash\//package:ikun_clash\//g' || true
          fi

      - name: Fix Dart SDK constraint
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          sed -i 's/sdk: ">=3.12.0 <4.0.0"/sdk: ">=3.13.0 <4.0.0"/g' pubspec.yaml
          sed -i "s/sdk: '>=3.12.0 <4.0.0'/sdk: '>=3.13.0 <4.0.0'/g" pubspec.yaml

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Android NDK
        run: |
          echo "===== 查找 sdkmanager ====="

          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "===== 安装 NDK 26.3.11579264 ====="

          "$SDKMANAGER" "ndk;26.3.11579264"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.3.11579264"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "===== 当前 NDK ====="
          echo "$NDK_PATH"

          echo "===== 检查 clang ====="
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

          echo "===== 检查 libclang ====="
          ls -la "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"

      - name: Force NDK version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== 固定 Gradle NDK 版本 ====="

          if [ -f android/app/build.gradle ]; then

            sed -i -E \
              's/ndkVersion[[:space:]]*=?[[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion "26.3.11579264"/g' \
              android/app/build.gradle

            sed -i \
              's/ndkVersion flutter\.ndkVersion/ndkVersion "26.3.11579264"/g' \
              android/app/build.gradle

          fi

          if [ -f android/app/build.gradle.kts ]; then

            sed -i -E \
              's/ndkVersion[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']/ndkVersion = "26.3.11579264"/g' \
              android/app/build.gradle.kts

            sed -i \
              's/ndkVersion = flutter\.ndkVersion/ndkVersion = "26.3.11579264"/g' \
              android/app/build.gradle.kts

          fi

          echo "===== NDK 配置 ====="

          grep -R "ndkVersion" android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Check NDK environment
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test "$ANDROID_NDK" = "$ANDROID_NDK_HOME"

      - name: Check Flutter version
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter clean
          flutter pub get

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IKUN-Clash-ARM64
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Finish
        run: |
          echo "======================================"
          echo "IKUN Clash ARM64 APK 构建完成！"
          echo "======================================"
